name: starry_ui
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  emoji_regex: ^0.0.5
  flutter:
    sdk: flutter
  flutter_staggered_grid_view: ^0.7.0
  widgetbook: ^3.23.0
  widgetbook_annotation: ^3.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  widgetbook_generator: ^3.24.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: fonts/Outfit-VF.ttf
    - family: Inter
      fonts:
        - asset: fonts/Inter-VF.ttf
    - family: MiSans
      fonts:
        - asset: fonts/MiSans-VF.ttf
    - family: Twemoji
      fonts:
        - asset: fonts/Twemoji.ttf
