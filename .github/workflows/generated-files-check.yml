name: Generated Files Reproducibility Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check-generated-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate build_runner output
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify no diff (generated files are up-to-date)
        run: git diff --exit-code
